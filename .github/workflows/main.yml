name: Docker Hub Release

on:
  # 正式版本：在 GitHub 创建 Release 时触发
  release:
    types: [created]
  # 预发布版本：推送 tag 时触发
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 释放 GitHub Actions 磁盘空间
      - name: Free Disk Space
        run: |
          # 删除 Android SDK（约 2GB）
          sudo rm -rf /usr/local/lib/android

          # 删除 .NET 库（约 1GB）
          sudo rm -rf /usr/share/dotnet

          # 删除 Haskell 工具链（约 500MB）
          sudo rm -rf /opt/ghc

          # 删除 Docker 旧镜像（如果存在）
          docker system prune -af --volumes || true

          # 删除缓存和临时文件
          sudo rm -rf /tmp/*
          sudo rm -rf ~/.cache/*
          sudo rm -rf /var/cache/apt/archives/*

          # 清理 APT 缓存
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y

          # 显示剩余空间
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # === 预发布版本额外步骤 ===
      - name: Create Pre-release
        if: github.event_name == 'push'
        run: |
          gh release create "${{ github.ref_name }}" \
            --prerelease \
            --title "预发布版本 ${{ github.ref_name }}" \
            --notes "自动化构建的预发布版本"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload docker-compose.yml
        if: github.event_name == 'push'
        run: |
          # 复制 docker-compose.yml 并替换镜像标签
          sed 's|derbay32/komari-bot-bertservices:latest|derbay32/komari-bot-bertservices:${{ github.ref_name }}|g' docker-compose.yml > docker-compose-release.yml

          # 上传到 Release
          gh release upload "${{ github.ref_name }}" docker-compose-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === 正式版本额外步骤：上传部署包 ===
      - name: Create deployment package
        if: github.event_name == 'release'
        run: |
          mkdir -p deploy-package

          # 复制必要文件
          cp docker-compose.yml deploy-package/
          cp .env.example deploy-package/
          cp -r deploy/monitoring deploy-package/

          # 创建模型目录和 README
          mkdir -p deploy-package/models
          cp deploy/README.md deploy-package/README.md

          # 打包
          tar czf bert-scoring-deploy-${{ github.ref_name }}.tar.gz -C deploy-package .

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: bert-scoring-deploy-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === 构建和发布 ===
      - name: Determine version type
        id: check_release
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate Tags
        uses: docker/metadata-action@v4
        id: metadata
        with:
          images: |
            derbay32/komari-bot-bertservices
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ steps.check_release.outputs.is_release == 'true' }}

      - name: Build and Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
